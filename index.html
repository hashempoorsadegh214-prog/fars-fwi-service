<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پایش حریق - نقشه اختصاصی استان فارس</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
        body, html { height: 100%; width: 100%; background-color: #0b0f19; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background-color: #0b0f19; }

        .header-panel {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(11, 15, 25, 0.9);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            backdrop-filter: blur(8px);
        }
        .header-title h1 { font-size: 1.1rem; }
        .header-title p { font-size: 0.75rem; color: #94a3b8; }

        .legend-panel {
            position: absolute;
            bottom: 25px;
            left: 20px;
            z-index: 1000;
            background: rgba(11, 15, 25, 0.9);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.75rem;
        }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; }
    </style>
</head>
<body>

    <div class="header-panel">
        <div class="header-title">
            <h1>🔥 پایش حریق (FWI) - محدوده برش‌خورده استان فارس</h1>
            <p>بیرون از مرز استان فارس کاملاً ماسک و بریده شده است</p>
        </div>
    </div>

    <div class="legend-panel">
        <b>راهنمای خطر</b>
        <div class="legend-item"><div class="legend-color" style="background:#22c55e;"></div> کم (0 - 11.2)</div>
        <div class="legend-item"><div class="legend-color" style="background:#eab308;"></div> متوسط (11.2 - 21.3)</div>
        <div class="legend-item"><div class="legend-color" style="background:#f97316;"></div> زیاد (21.3 - 38.0)</div>
        <div class="legend-item"><div class="legend-color" style="background:#ef4444;"></div> بحرانی (بیشتر از 38)</div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>

    <script>
        const map = L.map('map', {
            center: [29.3, 53.2],
            zoom: 7,
            zoomControl: false
        });
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // برش زدن نقشه با ساخت ماسک معکوس (سوراخ کردن نقشه به شکل استان فارس)
        fetch('fars.geojson')
            .then(res => res.json())
            .then(data => {
                const worldMask = [
                    [-90, -180],
                    [-90, 180],
                    [90, 180],
                    [90, -180]
                ];

                const coords = data.features[0].geometry.coordinates;
                let hole = [];

                if (data.features[0].geometry.type === 'Polygon') {
                    hole = coords[0].map(c => [c[1], c[0]]);
                } else if (data.features[0].geometry.type === 'MultiPolygon') {
                    hole = coords[0][0].map(c => [c[1], c[0]]);
                }

                // ماسک کردن کامل بیرون از استان فارس
                L.polygon([worldMask, hole], {
                    stroke: false,
                    fillColor: '#0b0f19',
                    fillOpacity: 0.94
                }).addTo(map);

                // خط مرزی برجسته دور استان فارس
                const borderLayer = L.geoJSON(data, {
                    style: {
                        color: '#38bdf8',
                        weight: 2.5,
                        fillOpacity: 0.0
                    }
                }).addTo(map);

                map.fitBounds(borderLayer.getBounds(), { padding: [15, 15] });
            });

        // بارگذاری نقاط هیت‌مپ
        fetch('data/fwi_fars.json?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                if (!data.points) return;
                const heatPoints = data.points.map(p => [p.lat, p.lon, Math.min(1.0, p.fwi / 50.0)]);
                L.heatLayer(heatPoints, {
                    radius: 28,
                    blur: 20,
                    max: 1.0,
                    gradient: { 0.2: '#22c55e', 0.4: '#38bdf8', 0.6: '#eab308', 0.8: '#f97316', 1.0: '#ef4444' }
                }).addTo(map);
            })
            .catch(err => console.log('در حال انتظار برای داده:', err));
    </script>
</body>
</html>
