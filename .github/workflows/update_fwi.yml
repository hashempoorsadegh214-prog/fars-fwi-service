              known_coords = np.array([[p["lon"], p["lat"]] for p in fetched_data])
              known_vals = np.array([p["fwi"] for p in fetched_data])
              tree = cKDTree(known_coords)

              for lon, lat in missing_points:
                  k = min(8, len(known_coords))
