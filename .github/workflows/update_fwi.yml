name: Update FWI Iran

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-fwi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml geopandas shapely pandas pyproj scipy numpy

      - name: Fetch and Process FWI for Iran
        run: |
          python scripts/fetch_fwi.py

      - name: Commit and Push Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/fwi_fars.json
          git commit -m "Auto-update Iran FWI data [skip ci]" || echo "No changes to commit"
          git push
