name: Update FWI Iran

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  update-fwi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml geopandas shapely pandas xlsxwriter scipy numpy

      - name: Fetch and Process FWI for Iran
        run: |
          python - << 'EOF'
          import os
          import json
          import datetime
          import requests
          from bs4 import BeautifulSoup
          import geopandas as gpd
          from shapely.geometry import Point, box
          import numpy as np
          from scipy.spatial import cKDTree

          # گام شبکه برای کل ایران (۰.۲۵ درجه ~ ۲۵ کیلومتر جهت اجرای سریع و پایدار)
          GRID_STEP = 0.25
          BBOX = [44.0, 25.0, 63.5, 40.0]  # کل ایران: min_lon, min_lat, max_lon, max_lat
          WMS_URL = "https://maps.effis.emergency.copernicus.eu/gwis"

          # بارگذاری مرز ایران از IRAN.geojson
          iran_geom = None
          geojson_path = "IRAN.geojson"
          if os.path.exists(geojson_path):
              try:
                  gdf = gpd.read_file(geojson_path)
                  iran_geom = gdf.unary_union
                  print("Loaded IRAN.geojson successfully.")
              except Exception as e:
                  print(f"Error loading {geojson_path}: {e}")

          if iran_geom is None:
              print("Fallback: Using bounding box for Iran.")
              iran_geom = box(BBOX[0], BBOX[1], BBOX[2], BBOX[3])

          # تولید شبکه نقاط داخل مرز ایران
          lons = np.arange(BBOX[0], BBOX[2] + GRID_STEP, GRID_STEP)
          lats = np.arange(BBOX[1], BBOX[3] + GRID_STEP, GRID_STEP)
          target_points = []

          for lat in lats:
              for lon in lons:
                  p = Point(lon, lat)
                  if iran_geom.contains(p):
                      target_points.append((round(lon, 4), round(lat, 4)))

          print(f"Total target points inside Iran: {len(target_points)}")

          today_str = datetime.date.today().strftime("%Y-%m-%d")
          session = requests.Session()
          session.headers.update({"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"})

          fetched_data = []
          missing_points = []

          for lon, lat in target_points:
              delta = 0.02
              bbox_str = f"{lon - delta},{lat - delta},{lon + delta},{lat + delta}"
              params = {
                  "SERVICE": "WMS",
                  "VERSION": "1.1.1",
                  "REQUEST": "GetFeatureInfo",
                  "LAYERS": "ecmwf.query",
                  "QUERY_LAYERS": "ecmwf.query",
                  "BBOX": bbox_str,
                  "WIDTH": "101",
                  "HEIGHT": "101",
                  "X": "50",
                  "Y": "50",
                  "SRS": "EPSG:4326",
                  "INFO_FORMAT": "text/html",
                  "TIME": today_str
              }
              val = None
              try:
                  res = session.get(WMS_URL, params=params, timeout=7)
                  if res.status_code == 200 and "fwi" in res.text.lower():
                      soup = BeautifulSoup(res.text, "lxml")
                      for cell in soup.find_all(["td", "th", "span"]):
                          text = cell.get_text().strip()
                          try:
                              flt = float(text)
                              if 0 <= flt <= 150:
                                  val = flt
                                  break
                          except ValueError:
                              continue
              except Exception:
                  pass

              if val is not None:
                  fetched_data.append({"lon": lon, "lat": lat, "fwi": round(val, 2), "interpolated": False})
              else:
                  missing_points.append((lon, lat))

          print(f"Directly fetched: {len(fetched_data)}, Missing for IDW: {len(missing_points)}")

          # درون‌یابی نقاط فاقد داده با روش IDW
          if fetched_data and missing_points:
              known_coords = np.array([[p["lon"], p["lat"]] for p in fetched_data])
              known_vals = np.array([p["fwi"] for p in fetched_data])
              tree = cKDTree(known_coords)

              for lon, lat in missing_points:
                  k = min(8, len(known_coords))
                  distances, indices = tree.query([lon, lat], k=k)
                  
                  if np.any(distances < 1e-5):
                      interp_val = known_vals[indices[np.argmin(distances)]]
                  else:
                      weights = 1.0 / (distances ** 2)
                      interp_val = np.sum(weights * known_vals[indices]) / np.sum(weights)

                  fetched_data.append({
                      "lon": lon,
                      "lat": lat,
                      "fwi": round(float(interp_val), 2),
                      "interpolated": True
                  })

          all_fwi = [p["fwi"] for p in fetched_data] if fetched_data else [0]
          
          # محاسبه تاریخ شمسی تقریبی
          today = datetime.date.today()
          output_data = {
              "forecast_date": today_str,
              "forecast_shamsi": f"{today.year}/{today.month:02d}/{today.day:02d}",
              "statistics": {
                  "count": len(fetched_data),
                  "mean": round(float(np.mean(all_fwi)), 2),
                  "max": round(float(np.max(all_fwi)), 2),
                  "min": round(float(np.min(all_fwi)), 2)
              },
              "points": fetched_data
          }

          os.makedirs("data", exist_ok=True)
          with open("data/fwi_fars.json", "w", encoding="utf-8") as f:
              json.dump(output_data, f, ensure_ascii=False, indent=2)

          print("data/fwi_fars.json saved successfully.")
          EOF

      - name: Commit and Push Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/fwi_fars.json
          git commit -m "Auto-update Iran FWI data [skip ci]" || echo "No changes to commit"
          git push
